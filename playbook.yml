---
- name: Configure High Availability SonarQube Nodes
  hosts: sonarqube_nodes
  become: true
  gather_facts: true

  tasks:
    - name: 1. Set Kernel Optimization Parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: 'vm.max_map_count', value: '524288' }
        - { name: 'fs.file-max', value: '131072' }

    - name: 2. Install Docker & System Prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - unzip
          - docker.io
          - python3-pip
          - python3-docker
        state: present
        update_cache: yes

    - name: 3. Check if AWS CLI is installed
      command: aws --version
      register: aws_cli_check
      failed_when: false
      changed_when: false

    - name: 4. Download and Install AWS CLI v2 Bundle if missing
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -o awscliv2.zip
        sudo ./aws/install --update
      when: aws_cli_check.rc != 0

    - name: 5. Start and Enable Docker Service
      service:
        name: docker
        state: started
        enabled: yes

    - name: 6. Create Docker network for SonarQube
      docker_network:
        name: sonar_network
        state: present

    - name: 7. Spin up PostgreSQL Database Container
      docker_container:
        name: sonar_db
        image: postgres:15-alpine
        networks:
          - name: sonar_network
        state: started
        restart_policy: always
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar_secret_password
          POSTGRES_DB: sonarqube

    - name: 8. Pause to allow Database engine startup initialization
      pause:
        seconds: 15

    - name: 9. Spin up SonarQube Application Container
      docker_container:
        name: sonarqube_app
        image: sonarqube:community
        networks:
          - name: sonar_network
        state: started
        restart_policy: always
        published_ports:
          - "9000:9000"
        env:
          SONAR_JDBC_USERNAME: sonar
          SONAR_JDBC_PASSWORD: sonar_secret_password
          SONAR_JDBC_URL: "jdbc:postgresql://sonar_db:5432/sonarqube"
        ulimits:
          - "nofile:65536:65536"