---
- name: Configure High Availability SonarQube Nodes
  hosts: sonarqube_nodes
  become: yes
  tasks:
    - name: 1. Set Kernel Optimization Parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      with_items:
        - { name: 'vm.max_map_count', value: '524288' }
        - { name: 'fs.file-max', value: '131072' }

    - name: 2. Install Docker Prerequisites
      apt:
        name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release, python3-pip]
        state: present
        update_cache: yes

    - name: 3. Setup Docker Keyring and Repo
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

    - name: 4. Install Docker Engine
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: yes

    - name: 5. Create Stack Directory
      file:
        path: /opt/sonar-ha-stack
        state: directory
        mode: '0755'

    - name: 6. Template out Integrated Docker Compose Configuration
      copy:
        dest: /opt/sonar-ha-stack/docker-compose.yml
        content: |
          version: '3.8'
          services:
            sonarqube-db:
              image: postgres:14
              container_name: sonarqube_db
              environment:
                - POSTGRES_USER=sonar
                - POSTGRES_PASSWORD=SonarSecure2026!
                - POSTGRES_DB=sonar
              volumes:
                - postgres_data:/var/lib/postgresql/data
              ports:
                - "5432:5432"

            sonarqube:
              image: sonarqube:10.4.1-community
              container_name: sonarqube_node
              ports:
                - "9000:9000"
              depends_on:
                - sonarqube-db
              environment:
                - SONAR_JDBC_USERNAME=sonar
                - SONAR_JDBC_PASSWORD=SonarSecure2026!
                - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
              volumes:
                - sonar_data:/opt/sonarqube/data
                - sonar_extensions:/opt/sonarqube/extensions
                - sonar_logs:/opt/sonarqube/logs
          volumes:
            postgres_data:
            sonar_data:
            sonar_extensions:
            sonar_logs:

    - name: 7. Run Containerized Stack
      command:
        cmd: docker compose up -d
        chdir: /opt/sonar-ha-stack
